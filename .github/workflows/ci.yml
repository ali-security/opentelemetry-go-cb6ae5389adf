name: ci
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Go test -run regex; empty runs the full suite"
        required: false
        default: ""
env:
  # Default version of Go to use by CI workflows. This should be the latest
  # release of Go; developers likely use the latest release in development and
  # we want to catch any bugs (e.g. lint errors, race detection) with this
  # release before they are merged. The Go compatibility guarantees ensure
  # backwards compatibility with the previous two minor releases and we
  # explicitly test our code for these versions so keeping this at prior
  # versions does not add value.
  DEFAULT_GO_VERSION: "~1.23.0"
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 ## Needed for "Set internal/tools/go.mod timestamp" step.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Tools cache
        uses: actions/cache@v4
        env:
          cache-name: go-tools-cache
        with:
          path: .tools
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('./internal/tools/**') }}
      # The step below is needed to not rebuild all the build tools.
      - name: Set internal/tools/go.mod timestamp
        run: |
          filename="internal/tools/go.mod"
          unixtime=$(git log -1 --format="%at" -- "${filename}")
          touchtime=$(date -d @$unixtime +'%Y%m%d%H%M.%S')
          touch -t ${touchtime} "${filename}"
          ls -la --time-style=full-iso "${filename}"
      - name: Generate
        run: make generate
      - name: Run linters
        # `lint` = misspell lint-modules golangci-lint govulncheck; govulncheck is
        # dropped because it fails on go1.23 stdlib advisories fixed only in Go >= 1.24.
        # lint-modules (`go mod tidy` in every module) is dropped because the sealed
        # go.mod/go.sum files are kept byte-identical to the released ones: the
        # otlptrace test imports go-logr/logr/funcr, already required as `// indirect`,
        # and tidy would rewrite that marker and fail check-clean-work-tree.
        run: make toolchain-check license-check misspell golangci-lint vanity-import-check verify-readmes verify-mods
      - name: Build
        run: make build
      - name: Check clean repository
        run: make check-clean-work-tree
  test-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Environment
        run: |
          echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          cache-dependency-path: "**/go.sum"
      - name: Run benchmarks to check functionality
        run: make test-bench

  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run tests with race detector
        shell: bash
        run: |
          set -o pipefail
          if [ -n "${{ inputs.test-filter }}" ]; then
            make test-verbose ARGS="-v -race -run '${{ inputs.test-filter }}'" 2>&1 | tee "$RUNNER_TEMP/test-race.log"
          else
            make test-verbose 2>&1 | tee "$RUNNER_TEMP/test-race.log"
          fi
      - name: Test summary
        if: always()
        shell: bash
        run: |
          echo "Packages: $(grep -c '^ok ' "$RUNNER_TEMP/test-race.log") ok, $(grep -c '^FAIL' "$RUNNER_TEMP/test-race.log") FAIL lines"
          awk '
          /^ *=== (RUN|CONT|NAME) / { cur = $3; next }
          /^ *--- PASS: / { p++; next }
          /^ *--- FAIL: / { f++; next }
          /^ *--- SKIP: / { s++; skipped[s] = $3; next }
          /^ +[^ ]+\.go:[0-9]+: / { if (cur != "") { line = $0; sub(/^ +/, "", line); msg[cur] = (cur in msg) ? msg[cur] " | " line : line } }
          END {
            printf "TEST SUMMARY (all tests and subtests): %d passed, %d failed, %d skipped\n", p, f, s
            for (i = 1; i <= s; i++) printf "SKIPPED %s -- reason: %s\n", skipped[i], (skipped[i] in msg) ? msg[skipped[i]] : "(no t.Skip message)"
          }' "$RUNNER_TEMP/test-race.log"

  test-concurrent-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run ConcurrentSafe tests multiple times with race detector
        run: make test-concurrent-safe

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run coverage tests
        run: make test-coverage
      - name: Store coverage test output
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts-${{ env.DEFAULT_GO_VERSION }}
          path: coverage.txt

  codecov:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test-coverage]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-artifacts-${{ env.DEFAULT_GO_VERSION }}
      - name: Upload coverage report
        uses: codecov/codecov-action@v5.1.2
        with:
          fail_ci_if_error: true
          files: ./coverage.txt
          verbose: true

  compatibility-test:
    strategy:
      matrix:
        go-version: ["1.23.0", "~1.22.5"]
        platform:
          - os: ubuntu-latest
            arch: "386"
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: amd64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: "386"
          - os: windows-latest
            arch: amd64
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: "**/go.sum"
      - name: Run tests
        env:
          GOARCH: ${{ matrix.platform.arch }}
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            make test-short ARGS="-short -run '${{ inputs.test-filter }}'"
          else
            make test-short
          fi

  test-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [compatibility-test]
    if: always()
    steps:
      - name: Test if compatibility-test passed
        run: |
          echo ${{ needs.compatibility-test.result }}
          test ${{ needs.compatibility-test.result }} == "success"

  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.DEFAULT_GO_VERSION }}
          cache: false
      - name: Build module zip
        shell: bash
        env:
          GOFLAGS: -mod=mod
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -euo pipefail
          MOD_DIR="$GITHUB_WORKSPACE/exporters/otlp/otlptrace"
          # proxy.golang.org bundles the repo-root LICENSE into submodule zips
          cp "$GITHUB_WORKSPACE/LICENSE" "$MOD_DIR/LICENSE"
          mkdir -p "$RUNNER_TEMP/helper" "$RUNNER_TEMP/modzip"
          cd "$RUNNER_TEMP/helper"
          cat > main.go <<'EOF'
          package main

          import (
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          func main() {
              f, err := os.Create(os.Args[3])
              if err != nil {
                  panic(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[4]); err != nil {
                  panic(err)
              }
          }
          EOF
          printf 'module example.com/helper\n\ngo 1.23\n' > go.mod
          go get golang.org/x/mod@v0.24.0
          go run . go.opentelemetry.io/otel/exporters/otlp/otlptrace v1.34.0 "$RUNNER_TEMP/modzip/v1.34.0.zip" "$MOD_DIR"
          rm "$MOD_DIR/LICENSE"
          unzip -l "$RUNNER_TEMP/modzip/v1.34.0.zip"
      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/modzip/v1.34.0.zip
          if-no-files-found: error
